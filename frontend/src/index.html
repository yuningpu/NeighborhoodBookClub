<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>NeighborhoodApp</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <!-- Bootswatch theme: Cosmo (Bootstrap) -->
  <link href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.2/dist/cosmo/bootstrap.min.css" rel="stylesheet">
  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <script>
    // Theme initialization: default to dark unless user saved a preference
    (function(){
      try {
        var saved = localStorage.getItem('nbc-theme');
        var theme = saved ? saved : 'dark';
        if(theme === 'dark') document.documentElement.classList.add('dark');
      } catch(e) { /* ignore */ }
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
