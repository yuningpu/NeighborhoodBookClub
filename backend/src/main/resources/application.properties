# Application name
spring.application.name=neighborhood-book-club-api

# Server configuration
server.port=8080
server.servlet.context-path=/

# Database configuration (H2 in-memory)
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (useful for development)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Ensure data.sql runs after JPA schema generation
spring.jpa.defer-datasource-initialization=true

# JPA configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Logging configuration
logging.level.root=INFO
logging.level.com.bookclub=DEBUG

# CORS configuration handled in controller
